name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_os: win
            arch: x86_64
            runtime_os: win
            runtime_arch: x64
            ext: zip
          - os: windows-11-arm
            artifact_os: win
            arch: aarch64
            runtime_os: win
            runtime_arch: arm64
            ext: zip
          - os: ubuntu-latest
            artifact_os: linux
            arch: x86_64
            runtime_os: linux
            runtime_arch: x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            artifact_os: linux
            arch: aarch64
            runtime_os: linux
            runtime_arch: arm64
            ext: tar.gz
          - os: macos-15-intel
            artifact_os: macos
            arch: x86_64
            runtime_os: osx
            runtime_arch: x64
            ext: tar.gz
          - os: macos-latest
            artifact_os: macos
            arch: aarch64
            runtime_os: osx
            runtime_arch: arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Read project versions
        id: versions
        run: node tools/versions.mjs --ci
      - uses: actions/setup-python@v7
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        if: hashFiles('pyproject.toml') != ''
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn audit --level high
      - run: yarn run check
      - run: yarn release:dry-run
        if: github.event_name == 'workflow_dispatch'
      - run: yarn sync:runtime
        if: github.event_name != 'workflow_dispatch'
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: node tools/build-release.mjs
        if: github.event_name != 'workflow_dispatch'
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}
      - name: Apply app icon
        if: github.event_name != 'workflow_dispatch' && hashFiles('public/logo.ico') != ''
        shell: bash
        run: |
          for pkg_dir in dist/package-*; do
            [ -d "$pkg_dir" ] || continue
            gui=$(basename "$pkg_dir" | sed 's/^package-//')
            cp public/logo.ico "$pkg_dir/logo.ico"

            if [[ "${{ matrix.runtime_os }}" == "win" ]]; then
              if [ ! -f rcedit.exe ]; then
                rcedit_version="$RCEDIT_VERSION"
                curl -fsSL "https://github.com/electron/rcedit/releases/download/v${rcedit_version}/rcedit-x64.exe" -o rcedit.exe
              fi
              echo "$RCEDIT_SHA256  rcedit.exe" | sha256sum --check --strict
              exe="$(find "$pkg_dir" -maxdepth 1 -type f -name '*.exe' | head -n 1)"
              if [[ -n "$exe" ]]; then
                ./rcedit.exe "$exe" --set-icon public/logo.ico
                echo "[OK] Applied Windows executable icon: $exe ($gui)"
              else
                echo "[WARN] Windows executable was not found in $pkg_dir; skipped."
              fi
            fi
          done
      - name: Package
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          package_dirs=(dist/package-*/)
          if (( ${#package_dirs[@]} == 0 )); then
            echo "[ERR] no release packages were generated"
            exit 1
          fi
          for pkg_dir in "${package_dirs[@]}"; do
            gui=$(basename "$pkg_dir" | sed 's/^package-//')
            # macOS runners resolve `shell: bash` to the system bash 3.2, which predates the
            # parameter-expansion case modifiers, so uppercase through tr instead.
            gui_upper="$(printf '%s' "$gui" | tr '[:lower:]' '[:upper:]')"
            archive="MaaDuDuL-${{ matrix.artifact_os }}-${{ matrix.arch }}-${GITHUB_REF_NAME}-${gui_upper}.${{ matrix.ext }}"
            (
              cd "$pkg_dir"
              if [[ "${{ matrix.ext }}" == "zip" ]]; then
                7z a "../$archive" .
              else
                tar -czf "../$archive" .
                tar -tzvf "../$archive" > "../$archive.manifest"
                if ! awk '$1 ~ /^-/ && $0 ~ /(^|\/)(MaaDuDuL|MFAAvalonia|mxu|MaaPiCli|MaaAgentServer|maa-cli|python3?)$/ && $1 !~ /^-..x/ { print; bad=1 } END { exit bad }' "../$archive.manifest"; then
                  echo "[ERR] Unix archive is missing executable permission metadata"
                  exit 1
                fi
                echo "[OK] Unix archive executable metadata smoke passed"
              fi
            )
            rm -rf "$pkg_dir"
          done
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release notes
        shell: bash
        run: |
          echo "[已有 Mirror 酱？点击前往高速下载！](https://mirrorchyan.com/zh/projects?rid=MaaDuDuL&source=mddl-release&os=windows&arch=x64&channel=stable)" > release-notes.md
          tail -n +4 resource/Changelog.md >> release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
      - name: Upload to MirrorChyan
        if: github.repository_owner == 'kqcoxn'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f tag="$GITHUB_REF_NAME"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f tag="$GITHUB_REF_NAME"
