name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}

  android:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, android]
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release notes
        shell: bash
        run: |
          echo "[已有 Mirror 酱？点击前往高速下载！](https://mirrorchyan.com/zh/projects?rid=MaaDuDuL&source=mddl-release&os=windows&arch=x64&channel=stable)" > release-notes.md
          tail -n +4 resource/Changelog.md >> release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/*.apk
            release-assets/*.build-info.json
      - name: Upload to MirrorChyan
        if: github.repository_owner == 'kqcoxn'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f tag="$GITHUB_REF_NAME"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f tag="$GITHUB_REF_NAME"
