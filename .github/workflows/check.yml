name: Check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Read project versions
        id: versions
        run: node tools/versions.mjs --ci
      - uses: actions/setup-python@v7
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        if: hashFiles('pyproject.toml') != ''
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn audit --level high
      - run: yarn run check
      - run: uv sync --frozen
      - run: uv run --frozen python tools/configure.py
      - run: uv run --frozen python tools/check_resource.py resource/base
