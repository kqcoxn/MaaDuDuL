name: Android APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (MaaFwApp)
    runs-on: ubuntu-latest
    env:
      APPLICATION_ID: com.kqcoxn.maadudul.ci
      PI_PROFILE: ${{ github.workspace }}/resource-source/tools/ci/android/pi-profile.yaml
      MDDL_ANDROID_AGENT_DIR: ${{ github.workspace }}/agent-dist

    steps:
      - name: Checkout MaaDuDuL
        uses: actions/checkout@v7
        with:
          path: resource-source
          submodules: recursive

      - name: Read project versions
        run: node resource-source/tools/versions.mjs --ci

      - name: Checkout MaaFwApp
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ANDROID_APP_REPOSITORY }}
          ref: ${{ env.ANDROID_APP_REF }}
          path: app-source
          fetch-depth: 0

      - name: Checkout matching MaaFramework Python binding
        uses: actions/checkout@v7
        with:
          repository: MaaXYZ/MaaFramework
          ref: v${{ env.MAAFW_VERSION }}
          path: maafw-source
          sparse-checkout: source/binding/Python/maa

      - name: Setup build Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANDROID_PYTHON }}

      - name: Resolve package metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v${PROJECT_VERSION}" ]]; then
              echo "::error::Release tag does not match maa-project.json"
              exit 1
            fi
            display_version="$GITHUB_REF_NAME"
          else
            display_version="v${PROJECT_VERSION}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          fi
          artifact_name="MaaDuDuL-${display_version}-android-universal"
          # Retain the existing sequence across both clients and both workflow entry points.
          echo "VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=$display_version" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Prepare MaaDuDuL resources
        run: python resource-source/tools/package_android.py "$BUILD_VERSION_NAME"

      - name: Prepare MaaFramework native libraries
        working-directory: app-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/setup_maa_framework.py --tag "v$MAAFW_VERSION" --abi all

      - name: Prepare upstream Python agent bundles
        working-directory: app-source
        run: |
          python scripts/build_agent_bundle.py \
            --out "$MDDL_ANDROID_AGENT_DIR" \
            --abi arm64-v8a --abi x86_64 \
            --core-repo "$ANDROID_AGENT_CORE_REPOSITORY" \
            --core-tag "$ANDROID_AGENT_CORE_TAG" \
            --requirements "$GITHUB_WORKSPACE/resource-source/tools/ci/requirements-android.txt"
          python ../resource-source/tools/ci/android/align_binding.py \
            --bundles "$MDDL_ANDROID_AGENT_DIR" \
            --source ../maafw-source/source/binding/Python/maa \
            --manifest ../resource-source/maa-project.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-$ANDROID_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK" "cmake;$ANDROID_CMAKE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare existing Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MFA_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MFA_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.MFA_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MFA_ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          umask 077
          key_path="$RUNNER_TEMP/mddl-android.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          keytool -exportcert -keystore "$key_path" -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/mddl-signing.der"
          certificate_sha256=$(sha256sum "$RUNNER_TEMP/mddl-signing.der" | cut -d ' ' -f 1)
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "SIGNING_SHA256=$certificate_sha256" >> "$GITHUB_ENV"

      - name: Build signed MaaFwApp APK
        working-directory: app-source
        env:
          KEY_ALIAS: ${{ secrets.MFA_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.MFA_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MFA_ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon \
            --init-script "$GITHUB_WORKSPACE/resource-source/tools/ci/android/identity.init.gradle" \
            :app:assembleRelease

      - name: Verify APK and published upgrade identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python resource-source/tools/ci/android/verify_apk.py

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: android-artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mddl-android.jks" "$RUNNER_TEMP/mddl-signing.der"
