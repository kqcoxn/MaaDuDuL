[project]
name = "maa-dudul"
version = "1.2.1"
description = "MaaDuDuL MaaFW Agent project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "maafw==5.13.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.11.0",
    "json-with-comments"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["agent", "tools"]
extraPaths = ["agent"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

# MaaFramework 的 Python 包 (MaaFw) 不发布 PEP 561 类型存根；strict 模式下 Unknown 类型会从 maa 调用向外传播，这里统一抑制。
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
# MaaFW decorators and platform-specific stdlib modules expose attributes that strict Pyright cannot resolve consistently.
reportAttributeAccessIssue = "none"
